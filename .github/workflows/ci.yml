name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  logic-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install numpy opencv-python-headless pytest
      - run: python -m pytest -q test/test_emotion_classifier.py
  real-model:
    # The README quick start's fer install, then the repo's classifier on one public-domain test photo.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install --no-deps fer
          pip install tensorflow-cpu requests pillow numpy "opencv-python-headless<5" scikit-image  # OpenCV 5 dropped CascadeClassifier, which fer uses
      - run: PYTHONPATH=. python scripts/real_model_demo.py emotion.svg emotion.json
      - uses: actions/upload-artifact@v4
        with:
          name: emotion
          path: |
            emotion.svg
            emotion.json
  build:
    runs-on: ubuntu-22.04
    container: ros:humble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/facial_emotion_detector
      - name: Install dependencies (README quick start)
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select facial_emotion_detector --event-handlers console_direct+
      - name: Node and launch file installed
        run: |
          source install/setup.bash
          ros2 pkg executables facial_emotion_detector | grep -q emotion_detector
          test -f install/facial_emotion_detector/share/facial_emotion_detector/launch/emotion_detection.launch.py
